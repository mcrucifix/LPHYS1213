variables:
  PDF_FILENAME: "lphys1213.pdf" # À modifier selon le projet

stages:
  - build
  - upload
  - release # New stage

build_pdf:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pdf-cache # Unique cache key per branch
    paths:
      # 1. Directories containing generated files (needed by make)
      - 'Python/*.pdf'
      - 'Xp/*.eepic'
      - 'Pdftex/*.pdf_tex'
      - 'Pdftex/*.pdf'
      # 2. LaTeX intermediate files generated by latexmk (essential for fast recompile)
      - '**/*.aux'
      - '**/*.log'
      - '**/*.fls'
      - '**/*.fdb_latexmk'
      - '**/*.bbl'
      - '**/*.blg'
    policy: pull-push # Default behavior: pull the cache before script, push after script
  script:
    - git submodule update --init --recursive
    - make
    - echo "PDF_JOB_ID=$CI_JOB_ID" > artifacts_vars.env 
  artifacts:
    paths:
      - ${PDF_FILENAME}
      - artifacts_vars.env # NEW: Archive the variable file
    reports:
      dotenv: artifacts_vars.env # NEW: Make variables available to subsequent jobs
    expire_in: 1 week
  only:
    - main
  # when: manual

upload_pdf:
  stage: upload
  needs:
    - job: build_pdf
      optional: true
  script:
    - scp ${PDF_FILENAME} crucifix@aurora:/home/web/crucifix/direct

create_release:
  stage: release
  needs:
    - job: build_pdf
      artifacts: true
      optional: true
  script:
    - export PDF_URL="${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/jobs/${PDF_JOB_ID}/artifacts/file/${PDF_FILENAME}"
    - export MY_RELEASE_TAG="build-${CI_COMMIT_SHORT_SHA}"
    - ASSETS_JSON="[{\"name\":\"PDF\",\"url\":\"${PDF_URL}\"}]"
    - echo "Creating release for ${MY_RELEASE_TAG}"
    - |
      echo glab release create "${MY_RELEASE_TAG}" \
        --name "Release ${MY_RELEASE_TAG} with ${CI_COMMIT_SHORT_SHA}" \ 
        --notes "Automated build from commit ${CI_COMMIT_SHA}" \
        --assets-links "${ASSETS_JSON}"
    - |
      glab release create "${MY_RELEASE_TAG}" \
        --name "Release ${MY_RELEASE_TAG} with ${CI_COMMIT_SHORT_SHA}" \ 
        --notes "Automated build from commit ${CI_COMMIT_SHA}" \
        --assets-links "${ASSETS_JSON}"
  when: manual

