stages:
  - build
  - upload
  - release # New stage

build_pdf:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-pdf-cache # Unique cache key per branch
    paths:
      # 1. Directories containing generated files (needed by make)
      - 'Python/*.pdf'
      - 'Xp/*.eepic'
      - 'Pdftex/*.pdf_tex'
      - 'Pdftex/*.pdf'
      # 2. LaTeX intermediate files generated by latexmk (essential for fast recompile)
      - '**/*.aux'
      - '**/*.log'
      - '**/*.fls'
      - '**/*.fdb_latexmk'
      - '**/*.bbl'
      - '**/*.blg'
    policy: pull-push # Default behavior: pull the cache before script, push after script
  script:
    - git submodule update --init --recursive
    - make
    - echo "PDF_JOB_ID=$CI_JOB_ID" > artifacts_vars.env 
  artifacts:
    paths:
      - lphys1213.pdf
      - artifacts_vars.env # NEW: Archive the variable file
    reports:
      dotenv: artifacts_vars.env # NEW: Make variables available to subsequent jobs
    expire_in: 1 week
  only:
    - main
  when: manual

upload_pdf:
  stage: upload
  needs:
    - job: build_pdf
  script:
    - scp lphys1213.pdf crucifix@aurora:/home/web/crucifix/direct

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_pdf # Ensures this job runs after build_pdf and inherits its artifacts
  script:
    # 1. Get the Job ID (Assuming you have a variable set by a previous script/environment)
    # The Job ID is needed to build the artifact URL. Assuming PDF_JOB_ID is passed or defined.
    # FIX: Use single $ for shell variable access (PDF_JOB_ID will be empty if not defined, which might cause the error)
    - export PDF_URL="${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/jobs/${PDF_JOB_ID}/artifacts/file/lphys1213.pdf"
    # 2. Print the URL (for verification in logs)
    - echo "PDF Artifact URL':'' ${PDF_URL}"
    # 3. Create the release with the link in the description
    - |
      glab release create "${CI_COMMIT_REF_SLUG}" \
        --name "LPHYS1213 Release ${CI_COMMIT_SHORT_SHA}" \
        --notes "The PDF artifact is available here: [Download lphys1213.pdf](${PDF_URL})" \
        --assets-link "{\"name\":\"lphys1213.pdf\",\"url\":\"${PDF_URL}\",\"link_type\":\"other\"}"
  only:
    - main
  when: manual # Make this manual to control when a release is made

